<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Sfumatura di sfondo: Blu Indaco Profondo -> Verde Smeraldo Brillante -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b3bcf"/>
      <stop offset="45%" stop-color="#2a52be"/>
      <stop offset="80%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Ombreggiatura morbida stile icona iOS / PWA -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>

    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Sfondo Icona con Angoli Arrotondati (iOS Squircle standard) -->
  <rect width="512" height="512" rx="115" fill="#1e2433"/>
  <rect x="24" y="24" width="464" height="464" rx="95" fill="url(#bgGrad)" filter="url(#dropShadow)"/>

  <!-- Gruppo Grafico Vettoriale Bianco -->
  <g fill="#ffffff" filter="url(#innerGlow)">
    
    <!-- 1. ORBITA E QUADRANTE OROLOGIO -->
    <path d="M256 90 C165 90 90 165 90 256 C90 295 104 330 128 358 L146 342 C126 318 114 288 114 256 C114 178 178 114 256 114 C334 114 398 178 398 256 C398 288 386 318 366 342 L384 358 C408 330 422 295 422 256 C422 165 347 90 256 90 Z" />

    <!-- Tacche e numeri dell'orologio (9, 3, 12) -->
    <!-- Numero 9 -->
    <text x="135" y="266" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle">9</text>
    <!-- Numero 3 -->
    <text x="377" y="266" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle">3</text>
    <!-- Tacche orarie -->
    <rect x="252" y="122" width="8" height="14" rx="4"/>
    <rect x="348" y="152" width="8" height="14" rx="4" transform="rotate(45 352 159)"/>
    <rect x="156" y="152" width="8" height="14" rx="4" transform="rotate(-45 160 159)"/>

    <!-- 2. MINI CALENDARIO IN ALTO A DESTRA -->
    <g transform="translate(250, 95)">
      <!-- Corpo Calendario -->
      <rect x="0" y="16" width="96" height="84" rx="14" fill="#ffffff"/>
      <!-- Finestra interna per griglia -->
      <rect x="8" y="34" width="80" height="58" rx="6" fill="#10b981" fill-opacity="0.15"/>
      <!-- Anelli superiori del calendario -->
      <rect x="18" y="4" width="10" height="22" rx="5" fill="#ffffff" stroke="#2a52be" stroke-width="2"/>
      <rect x="68" y="4" width="10" height="22" rx="5" fill="#ffffff" stroke="#2a52be" stroke-width="2"/>
      <!-- Griglia caselle giorni -->
      <rect x="16" y="42" width="12" height="10" rx="2" fill="#2a52be"/>
      <rect x="34" y="42" width="12" height="10" rx="2" fill="#2a52be"/>
      <rect x="52" y="42" width="12" height="10" rx="2" fill="#2a52be"/>
      <rect x="70" y="42" width="12" height="10" rx="2" fill="#2a52be"/>
      <rect x="16" y="58" width="12" height="10" rx="2" fill="#2a52be"/>
      <rect x="34" y="58" width="12" height="10" rx="2" fill="#2a52be"/>
      <rect x="52" y="58" width="12" height="10" rx="2" fill="#2a52be"/>
      <rect x="70" y="58" width="12" height="10" rx="2" fill="#2a52be"/>
      <rect x="16" y="74" width="12" height="10" rx="2" fill="#2a52be"/>
      <rect x="34" y="74" width="12" height="10" rx="2" fill="#2a52be"/>
      <rect x="52" y="74" width="12" height="10" rx="2" fill="#2a52be"/>
      <rect x="70" y="74" width="12" height="10" rx="2" fill="#2a52be"/>
    </g>

    <!-- 3. LANCETTE DINAMICHE / SOSTITUZIONE (Freccia Veloce) -->
    <!-- Lancetta ore verso il 9 -->
    <rect x="165" y="250" width="95" height="12" rx="6"/>
    <!-- Lancetta minuti / Freccia veloce verso l'alto a destra (sostituzioni smart) -->
    <polygon points="256,256 390,140 405,150 262,264"/>
    <!-- Perno centrale -->
    <circle cx="256" cy="256" r="14" fill="#ffffff"/>
    <circle cx="256" cy="256" r="6" fill="#2a52be"/>

    <!-- 4. EDIFICIO SCOLASTICO MODERNO (BASE) -->
    <!-- Tetto spiovente centrale -->
    <polygon points="256,270 148,360 364,360"/>
    <!-- Tetti laterali -->
    <polygon points="152,360 90,380 90,360 152,342"/>
    <polygon points="360,360 422,380 422,360 360,342"/>
    
    <!-- Struttura e colonne della scuola -->
    <!-- Basamento inferiore unificato -->
    <rect x="100" y="440" width="312" height="16" rx="4"/>
    <!-- Pareti laterali ed edificio -->
    <rect x="110" y="375" width="18" height="70" rx="2"/>
    <rect x="384" y="375" width="18" height="70" rx="2"/>
    <rect x="186" y="375" width="16" height="70" rx="2"/>
    <rect x="310" y="375" width="16" height="70" rx="2"/>
    <rect x="110" y="370" width="292" height="14" rx="2"/>

    <!-- Finestra rotonda (rosone) sopra l'ingresso -->
    <circle cx="256" cy="330" r="16" fill="#2a52be"/>

    <!-- Portone centrale d'ingresso -->
    <path d="M232 444 L232 396 Q232 386 244 386 L268 386 Q280 386 280 396 L280 444 Z" fill="#2a52be"/>
    <circle cx="270" cy="418" r="3" fill="#ffffff"/>
  </g>
</svg>
